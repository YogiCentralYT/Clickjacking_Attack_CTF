<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Banking</title>
</head>
<body>
    <h1>Banking Site</h1>
    <div class="container">
        <h2>Welcome, User!</h2>
        <p>Account Balance: $
            <number class="number">1500</number>
        </p>
        <button onclick="transferFunds() && alert('You transferred $100!')">Transfer $100</button>
        <button onclick="payFee() && alert('You paid your monthly fee!')">Pay Monthly Fee</button>
        <button onclick="depositFunds() && alert('You viewed your transaction history!')">Deposit $100</button>
        <h3>Recent Transactions</h3>
        <div class="transactions"></div>
        
    </div>
</body>
</html>

<style>
    body{
        font-family: Arial, Helvetica, sans-serif;
        margin: 0;
    }
    h1{
        background-color: lightcoral;
        color: white;
        margin: 0;
        padding: 20px;
    }
    .container{
        padding-left:30px;
    }
    .number{
        border: solid 1px;
        padding: 0px 10px;
    }
    button{
        background-color: lightgray;
        color: black;
        border: solid 1px black;
        padding: 10px 13px;
        border-radius: 10px;
        cursor: pointer;
    }
</style>

<script>
    function transferFunds(){
        let num = document.querySelector('.number');
        let val = parseInt(num.textContent);
        val -= 100;
        num.textContent = val;
        addTransaction("Transferred $100");
    }
    function payFee(){
        let num = document.querySelector('.number');
        let val = parseInt(num.textContent);
        val -= 11;
        num.textContent = val;
        addTransaction("Paid monthly fee of $11");
    }
    function depositFunds(){
        let num = document.querySelector('.number');
        let val = parseInt(num.textContent);
        val += 100;
        num.textContent = val;
        addTransaction("Deposited $100");
    }
    function addTransaction(text){
        div = document.createElement('div')
        div.textContent = text;
        document.querySelector('.transactions').prepend(div);
    }
</script>
