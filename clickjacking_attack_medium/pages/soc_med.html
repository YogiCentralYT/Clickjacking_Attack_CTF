<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media</title>
</head>
<body>
    <h1>Social Media Site</h1>
    <div class="container">
        <h3>@thisismyaccount</h3>
        <img src="res/post.png" class = "post" alt="Image not loading"> Such a nice weather today!</p>
        <button onclick="alert('You liked your own post!')" class="main_btn">Like</button>
        <button onclick="alert('You commented on your own post!')" class="main_btn">Comment</button>
        <button onclick="alert('You shared your post!')" class="main_btn">Share</button>
        <button onclick="toggleDropdown()" class="main_btn">...</button>
        <div class="dropdown_menu">
            <button onclick="deletePost(); alert('You deleted your post!')">Delete</button>
            <button onclick="alert('You edited your post!')">Edit</button>
            <button onclick="alert('You reported your own post...why?')">Report</button>
        </div>
  </div>
    </div>
</body>
</html>

<style>
    body{
        text-align: center; 
        font-family: Arial, Helvetica, sans-serif;
        background-color: #ffdd6246;
        margin: 0;}
    h1{
        margin: 0;
        background-color: lightsalmon;
        padding: 20px;
    }
    .container{
        margin-top:50px;
        display: inline-block;
        text-align: left;
        border: 2px solid black;
        border-radius: 5%;
        background-color: white;
        padding: 10px;
        border-radius: 10px;
        max-width: 250px;
    }
    .post{
        display:block;
        max-width: 250px;
        height: auto;
    }
    .main_btn{
        background-color: cornflowerblue;
        border: none;
        padding: 10px 13px;
        color: white;
        border-radius: 10px;
        cursor: pointer;
    }
    .dropdown_menu{
        display: none;
        position: fixed;
        border: 1px solid black;
        border-radius: 5px;
        left: 55%;
    }
    .dropdown_menu button{
        display: block;
        border: none;
        color: white;
        background-color:cornflowerblue;
        padding: 8px;
        width: 100%;
        text-align: left;
    }
    .dropdown_menu button:hover{
        background-color: #f0f0f0;
        color: black;
    }
</style>

<script>
function toggleDropdown() {
  const menu = document.querySelector('.dropdown_menu');
  if(menu.style.display === 'block') {
    menu.style.display = 'none';
  } else {
    menu.style.display = 'block';
  }
}

function deletePost() {
  const post = document.querySelector('.post');
  post.remove();
}
</script>
